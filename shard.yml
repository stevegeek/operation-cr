name: operation_cr
version: 0.2.0

description: |
  Typed command objects for Crystal. Param macros build a typed
  initializer; .with, .then, .curry, and .explain layer partial
  application, linear composition, currying, and STDOUT tracing
  on top — all with compile-time kwarg key validation.

authors:
  - Stephen Ierodiaconou <stevegeek@gmail.com>

targets:
  ameba:
    main: lib/ameba/bin/ameba.cr

crystal: '>= 1.20.1'

license: MIT

repository: https://github.com/stevegeek/operation-cr
homepage: https://github.com/stevegeek/operation-cr
documentation: https://github.com/stevegeek/operation-cr#readme

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
    version: ~> 1.7.0
