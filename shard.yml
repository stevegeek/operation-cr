name: operation_cr
version: 0.2.0

description: |
  Typed command objects for Crystal. Param macros build a typed
  initializer; .with, .then, .curry, and .explain layer partial
  application, linear composition, currying, and STDOUT tracing
  on top — all with compile-time kwarg key validation.

authors:
  - Stephen Ierodiaconou <stevegeek@gmail.com>

