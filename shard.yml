name: operation_cr
version: 0.3.0

description: |
  Typed command objects for Crystal. Param macros build a typed
  initializer; .with, .then, .curry, and .explain layer partial
  application, linear composition, currying, and STDOUT tracing
  on top — all with compile-time kwarg key validation. An opt-in
  require adds a Success(T) | Failure result type with
  short-circuiting chains and pipelines.

authors:
  - Stephen Ierodiaconou <stevegeek@gmail.com>

crystal: '>= 1.20.1'

license: MIT

# Pinned to a commit, not a version: ameba's latest RELEASE (1.6.4) does not
# compile on Crystal 1.21 — `undefined method 'next_string_array_token' for
# Crystal::Lexer` — and the fix is only on master. 1.6.4 is fine on 1.20.1, so
# this pin is about the newer compiler, not about the shard. Move to `version:
# ~> 1.7` once 1.7.0 ships. A commit rather than `branch: master` so CI cannot
# break because someone else pushed.
development_dependencies:
  ameba:
    github: crystal-ameba/ameba
    commit: f53fcd3

repository: https://github.com/stevegeek/operation-cr
homepage: https://github.com/stevegeek/operation-cr
documentation: https://github.com/stevegeek/operation-cr#readme
